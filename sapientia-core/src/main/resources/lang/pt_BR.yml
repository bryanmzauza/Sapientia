# Catálogo pt-BR — localização oficial do Sapientia.
# Chaves em notação pontuada: <área>.<assunto>.<variante>. Veja docs/internal/i18n-strategy.md.
plugin:
  enabled: "<green>Sapientia v<white><version></white> ativado.</green>"
  disabled: "<yellow>Sapientia desativado.</yellow>"
  reload:
    success: "<green>Configuração recarregada em <white><ms>ms</white>.</green>"
    failure: "<red>Falha ao recarregar: <white><error></white></red>"
  pack:
    outdated: "O pacote de recursos do server.properties está desatualizado, e os jogadores veem os itens novos do Sapientia sem textura. Envie <path> e defina resource-pack-sha1=<sha1>."
    outdated-join: "<yellow>O pacote de recursos do servidor está desatualizado: itens novos do Sapientia aparecem sem textura. Envie <white><path></white> e defina <white>resource-pack-sha1=<sha1></white> no server.properties.</yellow>"
    unset: "As texturas do Sapientia precisam do pacote de recursos <path> (SHA-1 <sha1>). Hospede-o e defina-o como pacote do servidor no server.properties."

command:
  perf:
    header: "<gold>=== Desempenho do Sapientia <gray>(orçamento <white><budget> ms</white>/tick)</gray> ===</gold>"
    total: "<yellow>Total:</yellow> <white><avg> ms</white> <gray>média,</gray> <white><peak> ms</white> <gray>pico</gray>"
    section: "<gray> - <name>:</gray> <white><avg> ms</white> <gray>média,</gray> <white><peak> ms</white> <gray>pico</gray>"
    machines: "<yellow>Máquinas:</yellow> <white><registered></white> <gray>carregadas,</gray> <white><scheduled></white> <gray>agendadas,</gray> <white><sleeping></white> <gray>dormindo,</gray> <white><paused></white> <gray>pausadas,</gray> <white><backlog></white> <gray>atrasadas</gray>"
    networks: "<yellow>Redes:</yellow> <white><energy></white> <gray>de energia (<energy_blocks> blocos),</gray> <white><items></white> <gray>de itens (<item_blocks> blocos),</gray> <white><fluids></white> <gray>de fluidos (<fluid_blocks> blocos)</gray>"
    chunks: "<yellow>Chunks ativos:</yellow> <white><active></white> <gray>(raio de <radius> em volta de cada jogador)</gray>"
  unknown: "<red>Comando desconhecido. Tente <white>/sapientia help</white>.</red>"
  no-permission: "<red>Você não tem permissão para fazer isso.</red>"
  players-only: "<red>Este comando só pode ser executado por jogadores.</red>"
  era:
    current: "<gold>Era do servidor:</gold> <white><number> — <era></white>"
    summary: "<gray><summary></gray>"
    next-up: "<gray>Próxima era: <white><number> — <era></white></gray>"
    set: "<green>Era do servidor definida como <white><number> — <era></white>.</green>"
    lowered: "<yellow>A era baixou: o conteúdo das eras seguintes volta a ficar bloqueado.</yellow>"
    last: "<yellow>Esta já é a última era.</yellow>"
    usage: "<red>Uso: /sapientia era [info|set <0-24>|next]</red>"
    invalid: "<red>Era desconhecida: <white><value></white>. Use um número de 0 a 24.</red>"
  mining:
    usage: "<red>Uso: /sapientia mining mark <x1> <y1> <z1> <x2> <y2> <z2></red>"
    too-large: "<red>Essa área é grande demais (no máximo <white><max></white> blocos).</red>"
    marked: "<green><white><count></white> blocos marcados como colocados. Eles não darão minérios.</green>"
  help:
    header: "<gold>=== Ajuda do Sapientia ===</gold>"
    entry: "<yellow><usage></yellow> <gray>-</gray> <white><description></white>"
    desc:
      help: "Mostra esta mensagem de ajuda."
      reload: "Recarrega configuração e catálogos."
      reload-content: "Recarrega os YAMLs de override sem reiniciar o servidor."
      give: "Dá um item do Sapientia a um jogador."
      pack-build: "Gera o resource pack Java em plugins/Sapientia/sapientia-resources.zip."
      pack-build-bedrock: "Gera o .mcpack e os mappings do Geyser em plugins/Sapientia/."
      pack-build-all: "Gera os packs Java e Bedrock de uma vez."
      logistics: "Inspeciona e gerencia redes de logistica de itens."
      fluids: "Inspeciona redes de fluidos do Sapientia."
      logic: "Gerencia programas de logica programavel (DAG)."
      perf: "Mostra o custo por tick de cada subsistema do Sapientia."
      era: "Mostra a era do servidor ou a altera (set, next)."
      mining: "Marca uma área como blocos colocados, para que nunca dê minérios."
  logistics:
    usage: "<red>Uso: /sapientia logistics <info|policy|filter></red>"
    info:
      none: "<yellow>Nenhum no de logistica de itens por perto.</yellow>"
      header: "<gold>Filtro em <white><x>,<y>,<z></white></gold> <gray>node=<node></gray>"
      network: "<gray>Rede <white><network></white> · <count> no(s) · politica <policy></gray>"
      rule: "<gray>  <index>. <mode> <pattern></gray>"
      empty: "<gray>  (sem regras — ACCEPT_ALL)</gray>"
    policy:
      usage: "<red>Uso: /sapientia logistics policy <round_robin|priority|first_match></red>"
      success: "<green>Politica de roteamento ajustada para <white><policy></white>.</green>"
      not-found: "<red>Voce precisa mirar em um bloco de logistica do Sapientia.</red>"
    filter:
      usage: "<red>Uso: /sapientia logistics filter <add|remove|clear|list> [args]</red>"
      added: "<green>Regra adicionada: <mode> <pattern></green>"
      removed: "<green>Regra <index> removida.</green>"
      cleared: "<green>Todas as regras foram removidas.</green>"
      not-filter: "<red>Mire em um filtro de itens Sapientia para editar regras.</red>"
      bad-mode: "<red>O modo deve ser <white>whitelist</white> ou <white>blacklist</white>.</red>"
      bad-index: "<red>Indice de regra invalido: <white><value></white></red>"
  fluids:
    usage: "<red>Uso: /sapientia fluids <info></red>"
    info:
      none: "<yellow>Nenhum no de fluido por perto.</yellow>"
      header: "<gold>No de fluido em <white><x>,<y>,<z></white></gold> <gray>node=<node> tipo=<type></gray>"
      network: "<gray>Rede <white><network></white> · <count> no(s)</gray>"
      tank: "<gray>Tanque: <white><fluid></white> <amount>/<capacity> mB</gray>"
      empty: "<gray>(vazio)</gray>"
  logic:
    usage: "<red>Uso: /sapientia logic <list|info|load|unload|enable|disable|export|tick> [nome]</red>"
    unknown: "<red>Programa de logica desconhecido: <white><name></white></red>"
    list:
      header: "<gold>Programas de logica (<white><count></white>):</gold>"
      entry: "<gray>  <white><name></white> · ativo=<enabled></gray>"
    info:
      header: "<gold>Programa de logica <white><name></white></gold> <gray>ativo=<enabled></gray>"
      size: "<gray>nos=<white><nodes></white> arestas=<white><edges></white></gray>"
    load:
      success: "<green>Programa <white><name></white> carregado de <white><file></white>.</green>"
      io: "<red>Falha ao ler arquivo de logica: <white><error></white></red>"
      invalid: "<red>Programa de logica invalido: <white><error></white></red>"
    unload:
      success: "<green>Programa <white><name></white> removido.</green>"
    enable:
      success: "<green>Programa <white><name></white> ativado.</green>"
    disable:
      success: "<green>Programa <white><name></white> desativado.</green>"
    export:
      success: "<green>Programa <white><name></white> exportado para <white><path></white>.</green>"
      io: "<red>Falha ao gravar arquivo de logica: <white><error></white></red>"
    tick:
      success: "<green>Programa <white><name></white> executado uma vez.</green>"
      failure: "<red>Falha ao executar programa: <white><error></white></red>"
  give:
    usage: "<red>Uso: /sapientia give <jogador> <id> [quantidade]</red>"
    success: "<green>Entregue <white><amount></white> x <white><id></white> para <white><player></white>.</green>"
    unknown-item: "<red>Item desconhecido: <white><id></white></red>"
    invalid-amount: "<red>Quantidade inválida: <white><value></white></red>"
    player-not-found: "<red>Jogador não encontrado: <white><name></white></red>"
  reload:
    content:
      success: "<green>Overrides recarregados em <white><ms>ms</white> <gray>(itens=<items> blocos=<blocks> receitas=<recipes>)</gray>.</green>"
      issues: "<yellow><count> problema(s) de validação registrados; veja o log do servidor.</yellow>"
  pack:
    usage: "<red>Uso: /sapientia pack build <java|bedrock|all></red>"
    success: "<green>Resource pack gerado em <white><path></white> <gray>(<overrides> substituição(ões))</gray>. SHA-1: <white><sha1></white></green>"
    failure: "<red>Falha ao gerar o pack: <white><error></white></red>"
    bedrock:
      success: "<green>Pack Bedrock gerado em <white><pack></white>; mapeamento do Geyser em <white><mappings></white>.</green>"
      installed: "<green>Instalado no Geyser em <white><path></white>. Reinicie o Geyser para carregar o novo pack.</green>"
      manual: "<yellow>Geyser não encontrado neste servidor: copie o .mcpack para a pasta packs/ do Geyser e o mapeamento para custom_mappings/.</yellow>"
      unsupported: "<red>Alvo de pack desconhecido. Use <white>java</white>, <white>bedrock</white> ou <white>all</white>.</red>"

error:
  internal: "<red>Ocorreu um erro interno. Consulte o log do servidor.</red>"

item:
  wrench:
    name: "<aqua>Chave Sapientia</aqua>"
    lore: "<gray>Clique direito para inspecionar blocos Sapientia.</gray>"
    desc: "Mire em um bloco de energia segurando a chave para ver\no buffer e o resumo da rede em tempo real. Sem clicar."
  guide:
    name: "<gold>Guia Sapientia</gold>"
    lore: "<gray>Clique direito para abrir o guia.</gray>"
    desc: "Seu manual de campo. Abre uma UI em bau listando todos\nos itens, blocos e receitas Sapientia desbloqueados."
  flint_knife:
    name: "<white>Faca de Sílex</white>"
    desc: "Corte grama e samambaia com ela: 30% de chance de\nfibra vegetal, 10% de semente silvestre (linho em\nplanícies, erva medicinal em florestas). 64 usos."
  stone_hammer:
    name: "<white>Martelo de Pedra</white>"
    desc: "Ferramenta de bancada. Acima de pedregulho dá\ncascalho, acima de cascalho dá areia; a partir da\nera 2 tritura fragmentos de mineral. 64 usos."
  plant_fiber:
    name: "<green>Fibra Vegetal</green>"
    desc: "Cortada da grama com a faca de sílex. 3 fibras\nfazem um barbante; também cestos e o martelo."
  flax_seeds:
    name: "<yellow>Sementes de Linho</yellow>"
    desc: "Plante em terra arada. Encontradas com a faca de\nsílex em planícies e devolvidas na colheita."
  flax:
    name: "<yellow>Linho</yellow>"
    desc: "Colhido do linho maduro. A fibra vira tecido na\nera 2."
  herb_seeds:
    name: "<green>Sementes de Erva Medicinal</green>"
    desc: "Plante em terra arada. Encontradas com a faca de\nsílex em florestas e devolvidas na colheita."
  medicinal_herb:
    name: "<green>Erva Medicinal</green>"
    desc: "Colhida da erva madura. Faz chá medicinal e\npomada curativa."
  flour:
    name: "<white>Farinha</white>"
    desc: "Trigo moído na mó manual (3 cliques por farinha).\nFaz massa de pão."
  bread_dough:
    name: "<gold>Massa de Pão</gold>"
    desc: "Asse numa fornalha vanilla para ter pão de farinha."
  flour_bread:
    name: "<gold>Pão de Farinha</gold>"
    desc: "Sacia uma vez e meia o pão vanilla."
  herbal_tea:
    name: "<green>Chá Medicinal</green>"
    desc: "Beba para ter Regeneração I por 10 segundos."
  healing_salve:
    name: "<red>Pomada Curativa</red>"
    desc: "Clique direito para recuperar 3 corações. 30\nsegundos entre usos."
  compost:
    name: "<dark_green>Composto</dark_green>"
    desc: "Clique direito numa plantação: toda planta em\ncrescimento no 3x3 em volta avança um estágio."
  wood_ash:
    name: "<gray>Cinza de Madeira</gray>"
    desc: "Sobra da carvoaria. Faz lixívia; adubo na era 2."
  lye_bucket:
    name: "<gray>Balde de Lixívia</gray>"
    desc: "Ferva numa fornalha vanilla para ter potassa; o\nbalde vazio fica na fornalha."
  potash:
    name: "<white>Potassa</white>"
    desc: "Adubo na era 2, sabão e vidro na era 7."
  fire_clay:
    name: "<gold>Argila Refratária</gold>"
    desc: "Queime numa fornalha vanilla para ter um tijolo\nrefratário."
  fire_brick:
    name: "<gold>Tijolo Refratário</gold>"
    desc: "Reveste os fornos até a era 8, a começar pelo\nforno de argila."
  era_almanac:
    name: "<gold>Almanaque das Eras</gold>"
    lore: "<gray>Clique direito para ver o que cada era traz.</gray>"
    desc: "Lista as 25 eras e todos os itens, blocos e máquinas\nde cada uma, inclusive das eras ainda bloqueadas."
  prospector:
    name: "<aqua>Prospector</aqua>"
    lore: "<gray>Clique direito para escanear o chunk em busca de minerios.</gray>"
    desc: "Ferramenta de prospeccao GPS. Procura por reservatorios sub-bedrock nos chunks vizinhos (ativo em 1.7.1)."
  gps_handheld_map:
    name: "<aqua>Mapa GPS</aqua>"
    lore: "<gray>Clique direito dentro da cobertura do transmissor para ver os marcadores.</gray>"
    desc: "Mostra os marcadores GPS proximos quando o jogador esta na area de cobertura de um transmissor (ativo em 1.7.1)."

block:
  pedestal:
    name: "<white>Pedestal Sapientia</white>"
    desc: "Bloco decorativo para exibir itens ou marcar\nlocais importantes."
  console:
    name: "<gold>Console Sapientia</gold>"
    desc: "Bloco interativo de demonstracao. Reservado para\nUIs de automacao e scripting que virao a seguir."
  generator:
    name: "<yellow>Gerador Sapientia</yellow>"
    desc: "Produz energia a cada tick. Conecte com cabos para\nalimentar capacitores e consumidores na mesma rede."
  cable:
    name: "<gray>Cabo Sapientia</gray>"
    desc: "Liga nos de energia. Forma uma unica rede unindo\ntodos os blocos Sapientia adjacentes (6 vizinhos)."
  capacitor:
    name: "<aqua>Capacitor Sapientia</aqua>"
    desc: "Buffer de energia em massa. Suaviza picos de\ngeracao e demanda para os consumidores seguirem ativos."
  consumer:
    name: "<red>Consumidor Sapientia</red>"
    desc: "Consome energia a cada tick. Usado para verificar\nse sua rede esta gerando e entregando energia."
  hand_quern:
    name: "<white>Mó Manual</white>"
    desc: "Clique direito com trigo na mão: a cada três\ncliques, um trigo vira farinha. Até 16 por chunk."
  charcoal_pit:
    name: "<gold>Carvoaria</gold>"
    desc: "Queima lenta: 16 toras de um baú acima viram 24\ncarvões vegetais e 4 cinzas num baú abaixo, em 4\nminutos. Acesa enquanto queima. Até 8 por chunk."
  clay_furnace:
    name: "<gold>Forno de Argila</gold>"
    desc: "Funde minérios triturados e misturas de liga das\neras 2 a 4 (20 s cada). Só queima carvão e carvão\nvegetal; funis funcionam como num alto-forno. Até\n16 por chunk."
  fiber_basket:
    name: "<green>Cesto de Fibra</green>"
    desc: "Recipiente de 9 espaços que mantém o conteúdo\nquando quebrado. Funis enchem e esvaziam."
  workbench:
    name: "<gold>Bancada Sapientia</gold>"
    desc: "Grade 3x3 do Sapientia. Clique direito para abrir\ne montar as receitas empacotadas."
  item_cable:
    name: "<gray>Cabo de Itens Sapientia</gray>"
    desc: "Liga nos de logistica. Forma uma unica rede unindo\ntodos os blocos de logistica adjacentes (6 vizinhos)."
  item_producer:
    name: "<yellow>Produtor de Itens Sapientia</yellow>"
    desc: "Puxa itens a cada tick de um container vanilla\nadjacente (bau, barril, dispenser, ...)."
  item_consumer:
    name: "<aqua>Consumidor de Itens Sapientia</aqua>"
    desc: "Empurra itens a cada tick para um container vanilla\nadjacente conectado a mesma rede de logistica."
  item_filter:
    name: "<gold>Filtro de Itens Sapientia</gold>"
    desc: "Lista de permissao ou bloqueio por id de item.\nEdite via /sapientia logistics filter."
  fluid_pipe:
    name: "<gray>Tubulacao Sapientia</gray>"
    desc: "Liga nos de fluidos. Forma uma unica rede unindo\ntodos os blocos de fluido adjacentes (6 vizinhos)."
  fluid_pump:
    name: "<yellow>Bomba Sapientia</yellow>"
    desc: "Puxa fluido a cada tick de uma fonte vanilla\nadjacente (agua, lava, caldeirao)."
  fluid_tank:
    name: "<aqua>Tanque Sapientia</aqua>"
    desc: "Armazena fluido para a rede. Guarda apenas um\ntipo de fluido — sem mistura."
  fluid_drain:
    name: "<gold>Dreno Sapientia</gold>"
    desc: "Despeja fluido a cada tick em um destino vanilla\nadjacente (caldeirao ou bloco de ar substituivel)."

  cable_t2:
    name: "<gold>Cabo MV</gold>"
    desc: "Cabo de energia tier MV. Carrega ate 4x a vazao do cabo LV na mesma rede."
  capacitor_t2:
    name: "<gold>Capacitor MV</gold>"
    desc: "Buffer de energia em massa tier MV. 4x a capacidade do capacitor LV."
  transformer_lv_mv:
    name: "<gold>Transformador LV/MV</gold>"
    desc: "Conecta uma rede LV a uma rede MV. Faz step-up ou step-down sem queimar cabos."
  machine_casing:
    name: "<gold>Carcaca de Maquina</gold>"
    desc: "Carcaca compartilhada tier LV. Usada como nucleo em toda receita de maquina LV."
  machine_casing_mv:
    name: "<gold>Carcaca de Maquina MV</gold>"
    desc: "Carcaca compartilhada tier MV. Nucleo de toda maquina MV e do forno de inducao."
  macerator:
    name: "<gold>Britador</gold>"
    desc: "Maquina tier LV. Tritura fragmentos de mineral em 2x po do metal principal."
  ore_washer:
    name: "<gold>Lavador de Minerio</gold>"
    desc: "Maquina tier LV. Lava o po removendo impurezas e recuperando subprodutos."
  electric_furnace:
    name: "<gold>Forno Eletrico</gold>"
    desc: "Maquina tier LV. Funde po em lingote ao dobro da velocidade do forno vanilla."
  mixer:
    name: "<gold>Misturador</gold>"
    desc: "Maquina tier MV. Combina dois pos metalicos em po de liga (bronze, latao, eletro)."
  compressor:
    name: "<gold>Compressor</gold>"
    desc: "Maquina tier MV. Compacta placas e pos em formas mais densas."
  bench_saw:
    name: "<gold>Serra de Bancada</gold>"
    desc: "Maquina tier LV. Corta hastes em engrenagens e parafusos."
  plate_press:
    name: "<gold>Prensa de Placas</gold>"
    desc: "Maquina tier MV. Lamina lingotes em placas."
  extractor:
    name: "<gold>Extrusora</gold>"
    desc: "Maquina tier MV. Extruda lingotes em fios."
  induction_furnace_controller:
    name: "<gold>Controlador do Forno de Inducao</gold>"
    desc: "Controlador multibloco MV. Cerque com uma casca 3x3x3 de carcaca MV ou basalto liso para formar a estrutura."
  stainless_steel_casing:
    name: "<gold>Carcaca de Aco Inoxidavel</gold>"
    desc: "Carcaca de qualidade de refinaria. Usada como casca do multibloco 5x5x7 da refinaria de petroleo."
  pumpjack:
    name: "<gold>Bomba de Petroleo</gold>"
    desc: "Geoextrator tier MV. Puxa petroleo bruto do reservatorio do chunk abaixo."
  combustion_gen:
    name: "<gold>Gerador de Combustao</gold>"
    desc: "Gerador tier MV. Queima diesel ou gasolina em unidades estruturadas de energia."
  biogas_gen:
    name: "<gold>Gerador de Biogas</gold>"
    desc: "Gerador tier LV. Queima caldo nutritivo num fluxo lento e constante de energia."
  cracker:
    name: "<gold>Craqueador</gold>"
    desc: "Maquina tier MV. Craqueia fracoes pesadas de petroleo em fracoes mais leves."
  fermenter:
    name: "<gold>Fermentador</gold>"
    desc: "Maquina tier MV. Fermenta caldo nutritivo em precursores de biogas."
  still:
    name: "<gold>Alambique</gold>"
    desc: "Maquina tier MV. Destila mosto fermentado em fluidos purificados."
  bioreactor:
    name: "<gold>Biorreator</gold>"
    desc: "Maquina tier LV. Cultiva organicos em caldo nutritivo."
  oil_refinery_controller:
    name: "<gold>Controlador da Refinaria de Petroleo</gold>"
    desc: "Cabecalho multibloco da refinaria 5x5x7. Separa petroleo bruto em diesel, gasolina, lubrificante e alcatrao."
  cable_t3:
    name: "<aqua>Cabo HV</aqua>"
    desc: "Cabo de alta tensao. Conduz ate 4096 J/t entre maquinas HV."
  capacitor_t3:
    name: "<aqua>Capacitor HV</aqua>"
    desc: "Buffer de energia HV. Armazena grandes quantidades de energia."
  transformer_mv_hv:
    name: "<aqua>Transformador MV \u2194 HV</aqua>"
    desc: "Converte tensao entre as redes MV e HV."
  geothermal_gen:
    name: "<aqua>Gerador Geotermico</aqua>"
    desc: "Gerador HV. Extrai calor de fontes de lava proximas."
  gas_turbine:
    name: "<aqua>Turbina a Gas</aqua>"
    desc: "Gerador HV. Queima gases combustiveis para producao continua."
  rtg:
    name: "<aqua>RTG</aqua>"
    desc: "Gerador termoeletrico de radioisotopo. Energia HV constante e perpetua."
  electrolyzer:
    name: "<aqua>Eletrolisador</aqua>"
    desc: "Maquina HV. Decompoe fluidos em seus gases componentes."
  rolling_mill:
    name: "<aqua>Laminador</aqua>"
    desc: "Maquina HV. Lamina lingotes em chapas e fios."
  laser_cutter:
    name: "<aqua>Cortador a Laser</aqua>"
    desc: "Maquina HV. Corta wafers de silicio e pecas de precisao."
  chemical_reactor:
    name: "<aqua>Reator Quimico</aqua>"
    desc: "Maquina HV. Reage gases e liquidos sob pressao."
  pressurized_pipe:
    name: "<aqua>Tubo Pressurizado</aqua>"
    desc: "Tubo HV. Conduz gases de alta pressao entre maquinas."
  gas_compressor:
    name: "<gold>Compressor de Gas</gold>"
    desc: "Maquina MV. Comprime gases atmosfericos em mB armazenado."
  boiler:
    name: "<gold>Caldeira</gold>"
    desc: "Maquina MV. Vaporiza liquidos em gases."
  condenser:
    name: "<gold>Condensador</gold>"
    desc: "Maquina MV. Condensa gases de volta a liquidos."
  liquefier:
    name: "<aqua>Liquefator</aqua>"
    desc: "Maquina HV. Liquefaz gases criogenicos."
  phase_separator:
    name: "<aqua>Separador de Fases</aqua>"
    desc: "Maquina HV. Separa misturas multifasicas em saidas puras."

  quarry_controller:
    name: "<aqua>Controlador de Pedreira</aqua>"
    desc: "Cabeca multibloco de pedreira 3x3x4. Mina uma AABB configuravel abaixo da estrutura (ativo em 1.7.1)."
  drill_rig_controller:
    name: "<aqua>Controlador de Sonda</aqua>"
    desc: "Cabeca multibloco de sonda 5x5x8. Realiza mineracao virtual sub-bedrock via tabelas de probabilidade (ativo em 1.7.1)."
  desalinator_controller:
    name: "<aqua>Controlador de Dessalinizador</aqua>"
    desc: "Cabeca multibloco de dessalinizador 5x3x3. Separa agua do mar em agua doce + sal-gema (ativo em 1.7.1)."
  gas_extractor:
    name: "<gold>Extrator de Gas</gold>"
    desc: "Maquina MV. Puxa bolsas de gas subterraneas para a rede de fluidos (ativo em 1.7.1)."
  atmospheric_collector:
    name: "<gold>Coletor Atmosferico</gold>"
    desc: "Maquina MV. Coleta a atmosfera do mundo em tanques de nitrogenio, argonio e CO2 (ativo em 1.7.1)."
  gps_transmitter:
    name: "<aqua>Transmissor GPS</aqua>"
    desc: "Emite o sinal de cobertura que ilumina o mapa portatil. Stub em 1.7.0; varredura em 1.7.1."
  gps_marker:
    name: "<aqua>Marcador GPS</aqua>"
    desc: "Ponto de referencia passivo dentro da cobertura do transmissor. Aparece no mapa portatil (ativo em 1.7.1)."

  item_buffer:
    name: "<aqua>Buffer de Itens</aqua>"
    desc: "Dreno de alta prioridade que suaviza picos de producao. Puxa itens da rede para um container adjacente."
  item_splitter:
    name: "<gold>Divisor de Itens</gold>"
    desc: "Distribui itens entre vizinhos de saida. A tabela de proporcoes chega com a refatoracao de roteamento em 1.8.1."
  filter_chamber:
    name: "<gold>Camara de Filtros</gold>"
    desc: "Filtro de multiplas passadas com ate quatro conjuntos de regras encadeados. Em 1.8.0 funciona em paridade com item_filter."
  overflow_module:
    name: "<yellow>Modulo de Transbordo</yellow>"
    desc: "Valvula de seguranca do roteamento. Ultimo recurso que so e preenchido quando todos os outros consumidores estao saturados."
  comparator_sensor:
    name: "<gray>Sensor Comparador</gray>"
    desc: "Le o nivel de um container adjacente para o runtime de logica. Ativo em 1.8.1."
  packager:
    name: "<aqua>Empacotador</aqua>"
    desc: "Empacota o conteudo de um container adjacente em uma unica stack packaged_bundle. Ativo em 1.8.1."
  unpackager:
    name: "<aqua>Desempacotador</aqua>"
    desc: "Inverso do empacotador: explode um packaged_bundle de volta em suas stacks. Ativo em 1.8.1."
  conveyor_belt:
    name: "<gray>Esteira Transportadora</gray>"
    desc: "Junction que roteia itens ao longo da linha. Renderizacao visivel do item sobre a esteira chega em 1.8.1."
  fluid_valve:
    name: "<gray>Valvula de Fluido</gray>"
    desc: "Junction que controla fluxo entre suas duas extremidades. Toggle manual e via logica chegam em 1.8.1."
  fluid_level_sensor:
    name: "<gray>Sensor de Nivel de Fluido</gray>"
    desc: "Le a proporcao de preenchimento de um fluid_tank adjacente para o runtime de logica. Ativo em 1.8.1."

