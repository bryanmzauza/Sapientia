      name: "<gold>Builder Android</gold>"
      desc: "Replays a saved schematic block by block."
    android_slayer:
      name: "<dark_red>Slayer Android</dark_red>"
      desc: "Combat drone. Damage and loot are produced from simulated tables — no real mob targeting."
