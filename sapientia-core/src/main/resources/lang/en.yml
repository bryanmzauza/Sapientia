era:
  arrival:
    name: "Arrival"
    summary: "The guide and the Sapientia Workbench."
  stone_age:
    name: "Stone Age"
    summary: "Farming, flint tools, the charcoal pit and the clay furnace."
  copper_age:
    name: "Copper Age"
    summary: "Native copper, gold and silver; rice, salt pans and hand looms."
  bronze_age:
    name: "Bronze Age"
    summary: "Tin and bronze, the gold pan, scythes and cheese."
  iron_age:
    name: "Iron Age"
    summary: "Bloomery and bellows, lead, cupellation, mercury and lime."
  classical_antiquity:
    name: "Classical Antiquity"
    summary: "Water wheels, mechanical machines, aqueducts, wine and brass."
  middle_ages:
    name: "Middle Ages"
    summary: "Windmills, the blast furnace, Damascus steel and acids."
  renaissance:
    name: "Renaissance"
    summary: "Precision mechanisms, optical glass, the printing press and New World crops."
  industrial_revolution:
    name: "Industrial Revolution"
    summary: "Steam, coke, Bessemer steel and mechanised farming."
  electricity:
    name: "Electricity"
    summary: "The LV network, electric machines, electrolysis and aluminium."
  steel_age:
    name: "Age of Steel"
    summary: "The MV network, steel alloys, flotation, the quarry and fertilisers."
  oil_and_chemistry:
    name: "Oil and Chemistry"
    summary: "Refineries, plastics, synthetic rubber, biofuels and medicine."
  electronics:
    name: "Electronics"
    summary: "The HV network, silicon, clean rooms and processors."
  atomic_age:
    name: "Atomic Age"
    summary: "Uranium enrichment, fission reactors and the EV network."
  space_age:
    name: "Space Age"
    summary: "Titanium, rockets, satellites, GPS and the RTG."
  information_age:
    name: "Information Age"
    summary: "Computers running logic programs, rare earths and the IV network."
  robotics:
    name: "Robotics"
    summary: "Androids working in the world, lithium batteries and farm drones."
  renewable_energy:
    name: "Renewable Energy"
    summary: "Solar, wind, fuel cells, recycling and vertical farms."
  fusion:
    name: "Fusion"
    summary: "Superconductors, the fusion reactor and the LuV network."
  nanotechnology:
    name: "Nanotechnology"
    summary: "Graphene, the molecular assembler and gene editing."
  orbital_age:
    name: "Orbital Age"
    summary: "Orbital stations, asteroid mining and the ZPM network."
  quantum_age:
    name: "Quantum Age"
    summary: "Quantum computers, item teleportation and quantum storage."
  antimatter:
    name: "Antimatter"
    summary: "Particle accelerators, antimatter cells and the UV network."
  interstellar:
    name: "Interstellar Age"
    summary: "Exotic matter, neutronium and the warp core."
  singularity:
    name: "Singularity"
    summary: "Transmutation, programmable matter and the Dyson sphere."
  announce: "<gold>A new era begins: <white><number> — <era></white>!</gold> <gray><summary></gray>"
  lore: "<dark_gray>Era <number>: <era></dark_gray>"
  locked:
    place: "<red>This belongs to era <number> (<era>), which is not unlocked on this server yet.</red>"

