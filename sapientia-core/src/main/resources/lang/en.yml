android:
  block:
    android_farmer:
      name: "<green>Farmer Android</green>"
      desc: "Programmable harvesting drone. Scans the surrounding chunk for mature crops on every tick of its DAG program (kinetic loop ships in 1.9.1)."
    android_lumberjack:
      name: "<dark_green>Lumberjack Android</dark_green>"
      desc: "Fells trees and replants saplings. 1.9.0 ships the catalogue + caps; tree topology scan ships in 1.9.1."
    android_miner:
      name: "<gray>Miner Android</gray>"
      desc: "Drills downward from its base block. Loot follows simulated tables driven by the assigned program."
    android_fisherman:
      name: "<aqua>Fisherman Android</aqua>"
      desc: "Cast-and-reel automation against any adjacent water source."
    android_butcher:
      name: "<red>Butcher Android</red>"
      desc: "Simulated mob loot generator. ADR-021 documents the no-real-mob policy."
