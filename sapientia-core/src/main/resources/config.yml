# Active locale for plugin messages. Bundled locales: en, pt_BR.
# Any unknown value falls back to 'en'.
locale: en

persistence:
  # Hikari pool size for SQLite. Writes serialise regardless; more only helps reads.
  pool-size: 4

resource-pack:
  # Resource pack format written to pack.mcmeta. 97 = Minecraft 26.3.
  # Values below 65 (pre-1.21.9) are ignored and replaced with the default.
  pack-format: 97
  # Give Sapientia items their own textures (minecraft:item_model component).
  # Players need the pack from "/sapientia pack build java" (set it as the
  # server resource pack in server.properties); without it these items render
  # as missing textures. Set to false to keep vanilla appearances.
  item-models: true

# Live readout rendered while a player aims at a Sapientia energy block
# holding the wrench. Costs one ray-trace + one packet per wrench holder per
# interval-ticks; negligible for typical player counts.
inspector:
  # Display mode. Values: actionbar | bossbar | off.
  display: actionbar
  # Max distance (in blocks) the wrench can inspect from.
  range: 6
  # How often the look-scan runs, in server ticks (20 ticks = 1 s).
  interval-ticks: 10

# Engine performance (Foundation 1). Sapientia is built to stay smooth with
# millions of active blocks: per-tick cost depends only on work that is due.
performance:
  # Main-thread time machines may use per tick, in milliseconds (a tick is 50 ms).
  # When exceeded, the remaining machines run on the next tick instead.
  tick-budget-ms: 5
  # Machines run only in chunks within this many chunks of a player.
  activity-radius: 4
  # How long a chunk keeps running after the last player leaves the radius.
  deactivate-delay-seconds: 30
  limits:
    # Every Sapientia block in one chunk, including cables and pipes.
    blocks-per-chunk: 2048
    # Blocks that process recipes or run periodically.
    processors-per-chunk: 256
    # Default limit for any single block type (heavy machines declare lower ones).
    same-type-per-chunk: 64
    # Per-block overrides, for example:
    #   "sapientia:quarry_controller": 1
    per-type: {}

# Eras and research (Foundation 2). The admin unlocks eras in order; content of
# a locked era cannot be crafted, placed, processed or found in the world.
progression:
  # Era of a new server (0 to 24). Era 0 is always unlocked. Used only until
  # the era is first changed with /sapientia era; the current era is saved.
  starting-era: 1
  # Announce in chat when a new era is unlocked.
  announce: true
  # Recipes need their Sapientia ingredients discovered first (crafted, picked
  # up, taken from a container or harvested). false: every recipe of an
  # unlocked era is available to everyone.
  research: true

# Minerals from natural terrain (Foundation 2). Breaking natural rock may drop
# a mineral fragment; placed, formed or moved blocks and explosions never do.
mining:
  enabled: true
  # Chunks generated before Sapientia was installed: natural (yield minerals)
  # or placed (only chunks generated from now on yield minerals).
  legacy-chunks: natural
  # Base chance per host block, in percent (Fortune raises it, veins triple it).
  # Unlisted blocks keep the defaults; set a block to 0 to disable it.
  host-chance: {}
  #   stone: 2.0
  #   granite: 4.0
  vein:
    # Veins cover square regions of this many chunks, derived from the world seed.
    region-chunks: 4
    # Chance that a region holds a vein.
    chance: 0.3
    # Fragment chance multiplier inside a vein, for the vein's mineral.
    multiplier: 3.0
